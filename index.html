<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NisanX AI Free - No Card Needed</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: rgba(15, 23, 42, 0.6);
      --border: rgba(255,255,255,0.1);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #60a5fa);
    }
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1e3a8a 100%);
      min-height: 100vh; color: white; display: flex; flex-direction: column;
    }

  .navbar {
      background: var(--bg-secondary); backdrop-filter: blur(20px);
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

  .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 20px; }
  .logo-box {
      width: 36px; height: 36px; border-radius: 10px; overflow: hidden;
      background: #1e293b; border: 1px solid var(--border);
    }
  .logo-box img { width: 100%; height: 100%; object-fit: cover; }

  .nav-actions { display: flex; align-items: center; gap: 12px; }
  .badge {
      background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5);
      padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
  .status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .icon-btn {
      width: 36px; height: 36px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; color: rgba(255,255,255,0.7);
    }
  .icon-btn:hover { background: rgba(56,189,248,0.2); color: var(--accent); }

  .chat-wrap {
      flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
    }

  .chat-container {
      width: 100%; max-width: 900px; height: 85vh;
      background: var(--bg-secondary); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }

  .chat-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
  .chat-header-left h2 { font-size: 18px; margin-bottom: 4px; color: var(--accent); }
  .chat-header-left p { font-size: 12px; color: rgba(255,255,255,0.5); }

  .chat-messages {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.3); border-radius: 10px; }

  .message {
      display: flex; gap: 12px; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  .message.user { flex-direction: row-reverse; }

  .avatar {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
  .avatar.bot { background: var(--accent-gradient); }
  .avatar.user { background: linear-gradient(135deg, #22c55e, #16a34a); }

  .msg-content {
      max-width: 75%; padding: 14px 18px; border-radius: 18px;
      font-size: 14px; line-height: 1.7; position: relative;
    }
  .message.bot.msg-content {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    }
  .message.user.msg-content {
      background: var(--accent-gradient); color: #0f172a; font-weight: 500;
    }

  .msg-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 6px; }

  .msg-actions {
      display: flex; gap: 8px; margin-top: 8px; opacity: 0; transition: 0.2s;
    }
  .message:hover.msg-actions { opacity: 1; }
  .msg-action-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;
      color: rgba(255,255,255,0.6); transition: 0.2s;
    }
  .msg-action-btn:hover { background: rgba(56,189,248,0.2); color: var(--accent); }

  .typing {
      display: flex; gap: 4px; padding: 14px 18px;
    }
  .typing span {
      width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
      animation: typing 1.4s infinite;
    }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

  .quick-questions {
      padding: 0 20px 16px; display: flex; gap: 8px; flex-wrap: wrap;
    }
  .quick-btn {
      background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3);
      color: var(--accent); padding: 8px 14px; border-radius: 20px;
      font-size: 12px; cursor: pointer; transition: 0.2s;
    }
  .quick-btn:hover { background: rgba(56,189,248,0.2); transform: translateY(-2px); }

  .chat-input-area { padding: 20px; border-top: 1px solid var(--border); }

  .file-preview {
      display: none; padding: 12px; background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.3); border-radius: 12px;
      margin-bottom: 12px; align-items: center; gap: 12px;
    }
  .file-preview.show { display: flex; }
  .file-preview img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
  .file-info { flex: 1; }
  .file-info p { font-size: 13px; margin-bottom: 2px; }
  .file-info span { font-size: 11px; color: rgba(255,255,255,0.5); }

  .chat-input {
      display: flex; gap: 12px; align-items: flex-end;
    }
  .input-wrap {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 16px; display: flex; align-items: center; padding: 4px;
    }
  .chat-input textarea {
      flex: 1; background: transparent; border: none; color: white;
      padding: 12px 16px; font-size: 14px; outline: none; resize: none;
      max-height: 120px; font-family: 'Poppins', sans-serif;
    }
  .chat-input textarea::placeholder { color: rgba(255,255,255,0.4); }

  .input-actions { display: flex; gap: 6px; padding: 0 8px; }

  .send-btn {
      background: var(--accent-gradient); color: #0f172a;
      border: none; width: 44px; height: 44px; border-radius: 14px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 768px) {
    .chat-container { height: 100vh; border-radius: 0; max-width: 100%; }
    .msg-content { max-width: 85%; }
    .chat-wrap { padding: 0; }
    .badge span { display: none; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">
      <div class="logo-box">
        <img src="NisanX.jpg" alt="NisanX Logo" id="logoImg">
      </div>
      NisanX AI Free
    </div>
    <div class="nav-actions">
      <div class="badge">
        <div class="status-dot"></div>
        <span>FREE • NO CARD</span>
      </div>
      <button class="icon-btn" onclick="clearChat()" title="Clear Chat">
        <i class="fa-solid fa-trash"></i>
      </button>
      <button class="icon-btn" onclick="exportChat()" title="Export">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-wrap">
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-header-left">
          <h2>🤖 Free AI Assistant</h2>
          <p>Powered by HuggingFace - No API Key Needed</p>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message bot">
          <div class="avatar bot">🤖</div>
          <div class="msg-content">
            Assalamu Alaikum boss! 🔥<br><br>
            Ami NisanX Free AI. Card chara, taka chara cholbe:<br><br>
            ✅ Website help<br>
            ✅ Coding problem solve<br>
            ✅ Business idea<br>
            ✅ Image analyze<br>
            ✅ Voice input<br><br>
            Ki help lagbe?
            <div class="msg-time" id="welcomeTime"></div>
          </div>
        </div>
      </div>

      <div class="quick-questions" id="quickQuestions">
        <button class="quick-btn" onclick="sendQuick('Website banate koto lage?')">💰 Price</button>
        <button class="quick-btn" onclick="sendQuick('React shikhbo kivabe?')">📚 Learn React</button>
        <button class="quick-btn" onclick="sendQuick('SEO tips deo')">📈 SEO Tips</button>
        <button class="quick-btn" onclick="sendQuick('E-commerce site lagbe')">🛒 E-commerce</button>
      </div>

      <div class="chat-input-area">
        <div class="file-preview" id="filePreview">
          <img id="previewImg" src="" alt="Preview">
          <div class="file-info">
            <p id="fileName">image.jpg</p>
            <span id="fileSize">0 KB</span>
          </div>
          <button class="icon-btn" onclick="removeFile()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="chat-input">
          <div class="input-wrap">
            <textarea
              id="userInput"
              placeholder="Message likho ba voice e bolo..."
              rows="1"
              onkeypress="handleKeyPress(event)"
              oninput="autoResize(this)"
            ></textarea>
            <div class="input-actions">
              <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload Image">
                <i class="fa-solid fa-image"></i>
              </button>
              <button class="icon-btn" onclick="toggleVoice()" id="voiceBtn" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
              </button>
            </div>
          <button class="send-btn" onclick="sendMessage()" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const filePreview = document.getElementById('filePreview');
    const voiceBtn = document.getElementById('voiceBtn');

    let chatHistory = JSON.parse(localStorage.getItem('nisanx_chat_free') || '[]');
    let currentFile = null;
    let isRecording = false;
    let recognition = null;

    // HuggingFace Free API - No key needed
    const HF_API_URL = 'https://api-inference.huggingface.co/models/microsoft/DialoGPT-large';

    // Initialize
    document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
    loadChatHistory();

    // Voice Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'bn-BD';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        stopRecording();
      };

      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function loadChatHistory() {
      chatHistory.forEach(msg => {
        addMessageToUI(msg.text, msg.sender, msg.time, false, msg.image);
      });
    }

    function saveChatHistory() {
      // Last 50 messages save koro
      if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);
      localStorage.setItem('nisanx_chat_free', JSON.stringify(chatHistory));
    }

    function sendQuick(text) {
      userInput.value = text;
      sendMessage();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' &&!event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message &&!currentFile) return;

      const userMsg = {
        text: message,
        sender: 'user',
        time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}),
        image: currentFile
      };

      addMessage(message, 'user', userMsg.time, currentFile);
      chatHistory.push(userMsg);
      saveChatHistory();

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;
      removeFile();

      showTyping();

      try {
        let reply;
        if (currentFile) {
          reply = await getImageAnalysis(message);
        } else {
          reply = await getFreeAIReply(message);
        }

        hideTyping();
        const botMsg = {
          text: reply,
          sender: 'bot',
          time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'})
        };

        addMessage(reply, 'bot', botMsg.time);
        chatHistory.push(botMsg);
        saveChatHistory();
      } catch (error) {
        hideTyping();
        addMessage('Sorry boss, free API ta ektu slow 😅 Abar try koro ba offline mode e answer dicchi.', 'bot');
        const fallback = getSmartFallback(message);
        addMessage(fallback, 'bot');
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    async function getFreeAIReply(message) {
      // HuggingFace Free API - No key needed
      try {
        const response = await fetch(HF_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            inputs: message,
            parameters: { max_length: 200, temperature: 0.7 }
          })
        });

        if (!response.ok) throw new Error('API Error');

        const data = await response.json();
        return data[0]?.generated_text || getSmartFallback(message);
      } catch {
        return getSmartFallback(message);
      }
    }

    async function getImageAnalysis(message) {
      // Free image caption API
      try {
        const response = await fetch('https://api-inference.huggingface.co/models/nlpconnect/vit-gpt2-image-captioning', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: currentFile })
        });

        const data = await response.json();
        const caption = data[0]?.generated_text || 'Image bujhte parlam na';
        return `Image e dekhte pacchi: ${caption}\n\n${message? 'Tomar proshno: ' + message : 'Ar kichu jante chao?'}`;
      } catch {
        return 'Image analyze korte parlam na boss 😢 Net check koro.';
      }
    }

    function getSmartFallback(message) {
      const msg = message.toLowerCase();

      if (msg.includes('price') || msg.includes('koto') || msg.includes('dam')) {
        return 'NisanX Package 💰\n\n✅ Basic - 500tk (1 page, 24h)\n🔥 Pro - 2000tk (5 page + dashboard)\n💼 Business - 5000tk (unlimited + payment)\n\nKontar details lagbe?';
      } else if (msg.includes('website') || msg.includes('site')) {
        return 'Hae boss! Website banai:\n\n✅ Landing Page - 500tk\n✅ Business Site - 2000tk\n✅ E-commerce - 5000tk+\n\nMobile responsive + SEO free. Order korba?';
      } else if (msg.includes('react') || msg.includes('learn')) {
        return 'React Roadmap 📚\n\n1️⃣ HTML/CSS/JS basics\n2️⃣ Components + Props\n3️⃣ State + Hooks\n4️⃣ Router + API\n5️⃣ Project banau\n\nYouTube e "Code with Harry" dekho, naki amar course niba?';
      } else if (msg.includes('seo')) {
        return 'SEO Tips 🔥\n\n1. Title e keyword\n2. Meta description\n3. Image alt text\n4. Fast loading\n5. Backlink\n6. Google My Business\n\nNisanX er shob site SEO ready ✅';
      } else if (msg.includes('ecommerce') || msg.includes('shop')) {
        return 'E-commerce Features 🛒\n\n✅ Product catalog\n💳 bKash/Nagad\n📦 Order track\n📱 Mobile app\n📊 Analytics\n\nPrice: 5000tk theke. Demo lagbe?';
      } else if (msg.includes('mobile') || msg.includes('app')) {
        return 'Mobile App 📱\n\n✅ Android + iOS\n⚡ Fast performance\n🎨 Custom UI\n💰 10k theke start\n\nKi dhoroner app?';
      } else {
        return 'Bujhte parchi boss! 😊\n\nAmi help korte pari:\n💻 Website development\n🛒 E-commerce\n📈 SEO & Marketing\n🤖 AI Chatbot\n📱 Mobile App\n\nKi niye kaj korba?';
      }
    }

    function addMessage(text, sender, time = null, image = null) {
      addMessageToUI(text, sender, time || new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}), true, image);
    }

    function addMessageToUI(text, sender, time, animate = true, image = null) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      if (!animate) messageDiv.style.animation = 'none';

      const avatar = sender === 'bot'? '🤖' : '👤';
      const avatarClass = sender === 'bot'? 'bot' : 'user';

      let imageHtml = '';
      if (image) {
        imageHtml = `<img src="${image}" style="max-width: 200px; border-radius: 12px; margin-bottom: 8px;">`;
      }

      messageDiv.innerHTML = `
        <div class="avatar ${avatarClass}">${avatar}</div>
        <div>
          <div class="msg-content">
            ${imageHtml}
            ${text.replace(/\n/g, '<br>')}
            <div class="msg-time">${time}</div>
          </div>
          ${sender === 'bot'? `
          <div class="msg-actions">
            <button class="msg-action-btn" onclick="copyMessage(this)"><i class="fa-solid fa-copy"></i> Copy</button>
            <button class="msg-action-btn" onclick="regenerateMessage(this)"><i class="fa-solid fa-rotate"></i> Again</button>
          </div>` : ''}
        </div>
      `;

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `
        <div class="avatar bot">🤖</div>
        <div class="msg-content">
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert('File 5MB er kom hote hobe');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        currentFile = e.target.result;
        document.getElementById('previewImg').src = currentFile;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
        filePreview.classList.add('show');
      };
      reader.readAsDataURL(file);
    }

    function removeFile() {
      currentFile = null;
      filePreview.classList.remove('show');
      document.getElementById('fileInput').value = '';
    }

    function toggleVoice() {
      if (!recognition) {
        alert('Voice input ei browser e nai 😢 Chrome use koro');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
        isRecording = true;
        voiceBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
        voiceBtn.style.background = 'rgba(239, 68, 68, 0.2)';
        voiceBtn.style.color = '#ef4444';
      }
    }

    function stopRecording() {
      isRecording = false;
      voiceBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
      voiceBtn.style.background = '';
      voiceBtn.style.color = '';
    }

    function copyMessage(btn) {
      const text = btn.closest('.message').querySelector('.msg-content').textContent;
      navigator.clipboard.writeText(text);
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy';
      }, 2000);
    }

    function regenerateMessage(btn) {
      const messages = chatMessages.querySelectorAll('.message.user');
      if (messages.length > 0) {
        const lastUserMsg = messages[messages.length - 1].querySelector('.msg-content').textContent;
        userInput.value = lastUserMsg;
        sendMessage();
      }
    }

    function clearChat() {
      if (confirm('Shob chat delete hoye jabe. Sure?')) {
        chatHistory = [];
        saveChatHistory();
        chatMessages.innerHTML = `
          <div class="message bot">
            <div class="avatar bot">🤖</div>
            <div class="msg-content">
              Chat clear! Notun kore shuru kori? 🔥
              <div class="msg-time">${new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'})}</div>
            </div>
          </div>
        `;
      }
    }

    function exportChat() {
      const text = chatHistory.map(msg =>
        `[${msg.time}] ${msg.sender === 'user'? 'You' : 'NisanX AI'}: ${msg.text}`
      ).join('\n\n');

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nisanx-chat-${Date.now()}.txt`;
      a.click();
    }

    userInput.focus();
  </script>
</body>
</html>
